<body>
<header>
  <div class="top"><h1>Сесія</h1><span class="cd" id="cd"></span></div>
  <nav id="nav"></nav>
</header>
<h2 class="page-heading" id="section-title"></h2>
<main id="main"></main>
<script src="/static/exam.js"></script>
<script>
const TABS=[["practice","Практика"],["exam","Іспит"],["today","Сьогодні"],["subjects","Предмети"],["items","Борги"],["record","Облік"],["cards","Картки"],["materials","Матеріали"]];
const ST={todo:"не зроблено",ready:"готово",submitted:"здано"},NEXT={todo:"ready",ready:"submitted",submitted:"todo"};
let S=null,tab="practice",deck=[],cur=0,shown=false,deckSubj="",fSubj="",fStat="open";
let reviewEvent=null;
let studyPhase="idle",savingReview=false,studyError="",firstPass=0,known=0;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=(p,o={})=>fetch(p,{headers:{"Content-Type":"application/json"},...o,body:o.body?JSON.stringify(o.body):undefined}).then(r=>r.json());
const fmt=t=>esc(t).replace(/`([^`]+)`/g,"<code>$1</code>");
const subj=k=>S.subjects.find(s=>s.key===k)||{name:k,color:"#888"};
const days=d=>Math.ceil((new Date(d)-new Date(S.today))/864e5);
const fileLink=f=>f?`<a href="/files/${encodeURI(f)}" target="_blank">файл</a>`:"";
const formPill=f=>`<span class="pill ${f==="Е"?"e":f==="ЗД"?"zd":""}">${f==="Е"?"екзамен":f==="ЗД"?"диф. залік":"залік"}</span>`;
async function load(){try{const state=await api("/api/state");if(!state.meta)throw Error();S=state;render();openStudy()}catch{$("#main").innerHTML='<div class="card" role="alert">Не вдалося завантажити дані. <button class="btn" onclick="load()">Спробувати знову</button></div>'}}
function setTab(t){tab=t;try{localStorage.setItem("tab",t)}catch(e){}render();openStudy()}
function render(){
  $("#section-title").textContent=TABS.find(([key])=>key===tab)?.[1]||"";
  const d=days(S.meta.session_start);
  $("#cd").textContent=d>0?`до сесії ${d} дн. (${S.meta.session_start.split("-").reverse().join(".")})`:"сесія триває";
  $("#nav").innerHTML=TABS.map(([k,v])=>`<button class="${k===tab?"on":""}" onclick="setTab('${k}')" aria-current="${k===tab?"page":"false"}">${navIcon(k)}${v}</button>`).join("");
  ({today,subjects,items,cards,materials,practice,exam:examTab,record:recordTab})[tab]();
  if(tab!=="cards")renderMath($("#main"));
}
function renderMath(element){
  if(window.renderMathInElement)renderMathInElement(element,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});
}
window.addEventListener("load",()=>{if(S)renderMath($("#main"))});
function subjStats(k){const it=S.items.filter(i=>i.subject===k),c=S.cardStats[k]||{total:0,due:0,learned:0};
  return{total:it.length,open:it.filter(i=>i.status==="todo").length,done:it.filter(i=>i.status!=="todo").length,c}}
function today(){
  const fresh=S.items.filter(i=>i.subject==="new"&&i.status==="todo"),open=S.items.filter(i=>i.status==="todo"&&i.subject!=="new"),due=Object.values(S.cardStats).reduce((a,b)=>a+(b.due||0),0);
  const ready=S.items.filter(i=>i.status==="ready").length;
  const sync=S.meta.last_sync?`<div class="mut" style="margin-top:6px">останнє оновлення даних: ${esc(S.meta.last_sync)}</div>`:"";
  const exams=S.subjects.filter(s=>s.exam_date && s.exam_date>=S.today).sort((a,b)=>a.exam_date.localeCompare(b.exam_date));
  const rv=S.reviews[0]&&S.reviews[0].d===S.today?S.reviews[0]:{n:0,ok:0};
  $("#main").innerHTML=`
  <div class="grid overview">
    <div class="card"><div class="mut">Борги (не зроблено)</div><div class="big">${open.length}</div><div class="mut">ще ${ready} готові, але не здані</div></div>
    <div class="card"><div class="mut">Картки на сьогодні</div><div class="big">${due}</div><div class="mut">повторено сьогодні: ${rv.n} (${rv.ok||0} правильно)</div>
      ${due?`<button class="btn" style="margin-top:8px" onclick="startDeck('')">Почати повторення</button>`:""}</div>
    <div class="card"><div class="mut">Найближчі екзамени</div>${exams.length?exams.slice(0,3).map(s=>`<div><b>${esc(s.name)}</b> — ${s.exam_date.split("-").reverse().join(".")} (${days(s.exam_date)} дн.)</div>`).join(""):`<div class="mut">Немає запланованих дат. Додати дату можна у «Предмети».</div>`}${sync}</div>
  </div>

  let body;
  if(studyPhase==="loading"||studyPhase==="idle"){
    body='<div class="card mut" role="status">Завантажуємо картки…</div>';
  }else if(studyPhase==="error"){
    body='<div class="card"><p role="alert">Не вдалося завантажити картки.</p><button class="btn" onclick="startDeck(deckSubj)">Спробувати ще раз</button></div>';

  }else{
    const c=deck[cur],s=subj(c.subject),repeating=cur>=firstPass;
    const position=repeating?cur-firstPass:cur, total=repeating?deck.length-firstPass:firstPass;
    const question=`<span>${fmt(questionText(c))}</span>`;
    body=`<div class="mut">${repeating?"Повтор помилок":"Картка"} ${position+1} із ${total} · ${esc(s.name)}</div>
      <progress value="${position}" max="${total}" aria-label="Прогрес підходу"></progress>
      ${modernExercise(c)?cardExercise(c,busy):(shown?`<div class="card flash" id="study-answer" tabindex="-1">${question}<div class="a">${answerMarkup(c)}</div></div>
        <div class="actions"><button class="btn bad" onclick="answer(false)" ${busy?"disabled":""}>Не знав</button>

async function answer(ok){
  if(!shown||savingReview||studyPhase!=="ready"||!deck[cur])return;
  savingReview=true;studyError="";updateStudy("#study-answer");
  try{
    const c=deck[cur];
    reviewEvent??={event:Date.now().toString(36)+"-"+Math.random().toString(36).slice(2),ok};
    ok=reviewEvent.ok;
    const result=await api(`/api/cards/${c.id}/review`,{method:"POST",body:reviewEvent});
    if(!Number.isInteger(result?.box))throw new Error("Review failed");
    if(cur<firstPass){
      if(ok)known++;
      else deck.push(c);
    }
    reviewEvent=null;cur++;writtenDraft="";shown=false;
    try{
      const state=await api("/api/state");
      if(state.cardStats)S=state;
    }catch{}
  }catch{
    studyError="Не вдалося зберегти відповідь. Спробуй ще раз.";
  }finally{
    savingReview=false;updateStudy(shown?"#study-answer":"#written-answer, #study-reveal, #study-end");
  }
}

    status.textContent=r.added?`Додано карток: ${r.added}`:"Додай рядки у форматі «питання :: відповідь».";

        if(state.cardStats)S=state;
        updateStudy();
      }catch{}
    }

  if(formula)options.push(formula.replace(/\$/g,""));
  if(card.subject==="phys"&&card.q==="Гідродинаміка — Гідравлічний прес"&&card.a_view&&card.src_a===card.a){
    options.push("Сила прямо пропорційна площі поршня","F1/S1=F2/S2","F1/F2=S1/S2","F₂/F₁=S₂/S₁","F₁/S₁=F₂/S₂");
  }
  const normalize=v=>normalizedAnswer(v).replace(/\s*([=/])\s*/g,"$1").replace(/(?<=[а-яіїєґa-z])\.$/iu,"");
  return options.some(v=>v&&normalize(v)===normalize(draft));
}
const storePractice="session-practice-v1";
let training=JSON.parse(localStorage.getItem(storePractice)||'{"notes":{},"groups":{},"images":{},"queue":[],"run":null}'),library=[],selected="",topic="",practiceLoading=false;
function remember(){localStorage.setItem(storePractice,JSON.stringify(training))}
function theme(c){if(c.q.includes(" — "))return c.q.split(" — ")[0];if(c.subject==="hist"&&c.q.includes(":"))return c.q.split(":")[0];return "Загальні питання"}
function chosen(){return library.filter(c=>(!selected||c.subject===selected)&&(!topic||theme(c)===topic))}
let flushing=false;
async function flush(){
 if(location.protocol==="file:"||flushing)return;flushing=true;
 try{while(training.queue.length){const event=training.queue[0];const r=await api('/api/cards/'+event.id+'/review',{method:'POST',body:event});if(!Number.isInteger(r.box))break;training.queue.shift();remember()}}catch{}finally{flushing=false}
}
function button(label,action){return '<button class="btn ghost" onclick="'+action+'">'+esc(label)+'</button>'}
async function practice(){
 if(practiceLoading)return;
 if(!library.length){$("#main").innerHTML='<p class="mut" role="status">Завантажуємо теми…</p>';practiceLoading=true;try{library=await api("/api/cards");if(!Array.isArray(library))throw Error()}catch{library=[];if(tab==="practice")$("#main").innerHTML='<p role="alert">Не вдалося завантажити теми.</p>'+button("Спробувати знову","practice()");return}finally{practiceLoading=false}}
 if(tab!=="practice")return;
 drawPractice();flush()
}
function drawPractice(){
 if(tab!=="practice")return;
 const main=$("#main"), r=training.run;
 if(r){
 const c=r.cards[r.i];
 if(!c||r.done){main.innerHTML='<div class="card"><h2>Розбір відповідей</h2><p>'+(!r.exam&&r.scores?'Згадано '+r.scores.filter(Boolean).length+' із '+r.i:'Відповідей записано: '+r.responses.filter(v=>v?.trim()).length+' із '+r.cards.length)+'</p>'+r.cards.map((c,i)=>'<p><b>'+esc(questionText(c))+'</b><br>Твоя відповідь: '+esc(r.responses[i]||'—')+'<br>Зразок: '+answerMarkup(c)+'</p>').join('')+button("До тем","finishPractice()")+'</div>';renderMath(main);return}
 const img=training.images[c.id];
 main.innerHTML='<div class="card"><div class="mut">'+(r.i+1)+' / '+r.cards.length+' <span id="clock"></span></div><progress aria-label="Прогрес" style="width:100%;accent-color:var(--acc)" value="'+r.i+'" max="'+r.cards.length+'"></progress><h2>'+fmt(questionText(c))+'</h2>'+(img?'<img alt="Схема до питання" style="max-width:100%;max-height:360px" src="'+esc(img)+'">':'')+'<label>Твоя відповідь<textarea id="typed" oninput="saveTyped(this.value)">'+esc(r.responses[r.i]||'')+'</textarea></label>'+
 (r.exam?button("Далі","advance(null)"):r.open?'<div class="card">'+answerMarkup(c)+'</div>'+button("Знав","advance(true)")+button("Не знав","advance(false)"):button("Звірити відповідь","showPractice()"))+
 '<details><summary>Дії з питанням</summary>'+button("Не розумію · додати конспект","markPractice()")+button("Редагувати","editPractice()")+button("Додати до білета","ticketPractice()")+'<label>Прикріпити схему <input type="file" accept="image/png,image/jpeg,image/webp" onchange="imagePractice(this)"></label></details>'+button("До каталогу","pausePractice()")+'</div>';renderMath(main);tickPractice();return}
 catalogue();
}
function beginPractice(mode){
 let list=chosen();
 if(mode==="weak"){const group=c=>JSON.stringify([c.subject,theme(c)]);const weak=new Set(list.filter(c=>c.wrong>0).map(group));list=list.filter(c=>weak.has(group(c))).sort((a,b)=>b.wrong-a.wrong)}
 if(mode==="notes")list=list.filter(c=>Object.hasOwn(training.notes,c.id));
 if(mode==="ticket"){const groups=[...new Set(list.map(c=>training.groups[c.id]).filter(Boolean))];const g=groups[Math.floor(Math.random()*groups.length)];list=list.filter(c=>g&&training.groups[c.id]===g)}
 if(!list.length){$("#practice-msg").textContent=mode==="ticket"?"Додай питання до білета через «Дії з питанням».":"Для цього режиму поки немає карток.";return}
 list=list.slice();if(mode!=="weak")for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
 if(training.paused&&!confirm("Почати новий підхід замість призупиненого?"))return;
 training.run={scores:[],cards:mode==="ticket"?list:list.slice(0,mode==="exam"?20:roundSize),i:0,responses:[],exam:mode==="exam",until:mode==="exam"?Date.now()+1800000:0};training.paused=null;remember();drawPractice()
}
function tickPractice(){const r=training.run;if(!r?.exam||r.done)return;const n=Math.ceil((r.until-Date.now())/1000);if(n<=0){r.done=true;remember();drawPractice()}else if($("#clock"))$("#clock").textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
setInterval(tickPractice,1000);
function saveTyped(v){training.run.responses[training.run.i]=v;remember()}
function showPractice(){training.run.open=true;remember();drawPractice()}
function advance(ok){const r=training.run,c=r.cards[r.i];if(ok!==null){training.queue.push({id:c.id,ok,event:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)});(r.scores||=[])[r.i]=ok;const item=library.find(x=>x.id===c.id)||c;const field=ok?"right":"wrong";item[field]=(item[field]||0)+1}r.i++;r.open=false;remember();drawPractice();flush()}
function finishPractice(){training.run=null;remember();drawPractice()}
function pausePractice(){training.paused=training.run;finishPractice()}
function resumePractice(){training.run=training.paused;training.paused=null;remember();drawPractice()}
function currentCard(){return training.run.cards[training.run.i]}
function markPractice(){const id=currentCard().id;const v=prompt("Посилання на конспект або примітка",training.notes[id]||"");if(v!==null){training.notes[id]=v;remember()}}
function ticketPractice(){const id=currentCard().id;const v=prompt("Номер білета",training.groups[id]||"");if(v!==null){training.groups[id]=v.trim();remember()}}
async function editPractice(){const c=currentCard(),q=prompt("Питання",questionText(c));if(!q?.trim())return;const a=prompt("Відповідь",answerText(c));if(!a?.trim())return;
 const displayQuestion=questionText(c),displayAnswer=answerText(c);
 if(q===displayQuestion&&a===displayAnswer)return;
 const separator=c.q.includes(" — ")?" — ":(c.subject==="hist"&&c.q.includes(":")?": ":"");
 const savedQ=q===displayQuestion?c.q:(separator&&!q.startsWith(theme(c)+separator)?theme(c)+separator+q:q);
 const savedA=savedQ===c.q&&a===displayAnswer?c.a:a;
 try{const result=await api('/api/cards/'+c.id,{method:'PATCH',body:{q:savedQ,a:savedA}});if(!result.ok)throw Error();const edited={q:savedQ,a:savedA,q_view:null,a_view:null,f_view:null};Object.assign(c,edited);Object.assign(library.find(x=>x.id===c.id)||{},edited);remember();drawPractice()}catch{alert("Для редагування потрібне з’єднання із сервером.")}}
async function imagePractice(input){const f=input.files[0];if(!f||!["image/png","image/jpeg","image/webp"].includes(f.type))return;if(f.size>400000){alert("Обери зображення до 400 КБ.");return}const id=currentCard().id,reader=new FileReader();reader.onload=()=>{training.images[id]=reader.result;try{remember();drawPractice()}catch{delete training.images[id];alert("Пам’ять браузера заповнена.")}};reader.readAsDataURL(f)}
function downloadFile(name,body,type){const u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function scriptJson(value){return JSON.stringify(value).replace(/</g,"\\u003c")}
function offlineEquations(cards){
  const equations={};
  for(const c of cards){
    for(const match of (questionText(c)+" "+answerText(c)).matchAll(/\$([^$]+)\$/g)){
      const expr=match[1];
      if(!Object.hasOwn(equations,expr)){
        if(!window.katex)throw Error("math");
        equations[expr]=katex.renderToString(expr,{output:"mathml",throwOnError:true});
      }
    }
  }
  return equations;
}
function drawOfflineMath(element,equations){
  const walker=document.createTreeWalker(element,NodeFilter.SHOW_TEXT),nodes=[];
  while(walker.nextNode()){
    const n=walker.currentNode;
    if(n.nodeValue.includes("$")&&!n.parentElement.closest("math,annotation,code,textarea,script,style"))nodes.push(n);
  }
  for(const n of nodes){
    const value=n.nodeValue,frag=document.createDocumentFragment();let offset=0;
    for(const m of value.matchAll(/\$([^$]+)\$/g)){
      const key=m[1].replace(/^\\displaystyle\s+/,"");
      if(!Object.hasOwn(equations,key))continue;
      const template=document.createElement("template");template.innerHTML=equations[key];
      frag.append(value.slice(offset,m.index),template.content);offset=m.index+m[0].length;
    }
    if(offset){frag.append(value.slice(offset));n.replaceWith(frag)}
  }
}
async function downloadPractice(){
 const list=chosen();if(!list.length)return;
 try{
   const res=await fetch("/");if(!res.ok)throw Error("fetch");
   let html=await res.text();
   const qs={},answers={},subjects=new Set(list.map(c=>c.subject));
   for(const c of list){
     if(Object.hasOwn(studyQuestions[c.subject]||{},c.q))(qs[c.subject]||={})[c.q]=questionText(c);
     if(Object.hasOwn(studyAnswers[c.subject]||{},c.q))(answers[c.subject]||={})[c.q]=studyAnswers[c.subject][c.q];
   }
   const start=html.indexOf("const studyQuestions="),end=html.indexOf("function questionText(",start);
   if(start<0||end<0)throw Error("version");
   html=html.slice(0,start)+"const studyQuestions="+scriptJson(qs)+";\nconst studyAnswers="+scriptJson(answers)+";\n"+html.slice(end);
   html=html.replace(/<(?:link|script)\b[^>]*cdn\.jsdelivr\.net[^>]*>(?:<\/script>)?/g,"");
   const selectedMap=map=>Object.fromEntries(list.filter(c=>Object.hasOwn(map,c.id)).map(c=>[c.id,map[c.id]]));
   const data={subjects:S.subjects.filter(s=>subjects.has(s.key)).map(({key,name,color,exam_date})=>({key,name,color,exam_date})),today:S.today,meta:{session_start:S.meta.session_start},cards:list,images:selectedMap(training.images),notes:selectedMap(training.notes),groups:selectedMap(training.groups),equations:offlineEquations(list)};
   const boot='const offlineData='+scriptJson(data)+';S=offlineData;library=offlineData.cards;for(const k of ["images","notes","groups"]){training[k]={...offlineData[k],...training[k]}}renderMath=element=>drawOfflineMath(element,offlineData.equations);tab="practice";drawPractice();';
   downloadFile("sesia-offline.html",html.replace(/\nload\(\);(?=\s*<\/script>)/,()=> '\n'+boot),'text/html');
 }catch(e){alert(e.message==="math"?"Формули ще не завантажилися. Перевір з’єднання й повтори.":"Не вдалося зберегти офлайн-копію.")}
}
